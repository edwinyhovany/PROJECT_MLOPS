# Configuración de la pipeline (valores que pueden cambiar sin tocar el código)

datos:
  ruta: data/Consumer_Portrait_ECommerce_Recommendation_Dataset.csv   # dataset real

division:
  test_size: 0.2
  random_state: 42          # también se registra como semilla en MLflow

modelo:
  tipo: gradient_boosting   # logistic_regression | gradient_boosting
  parametros:                 # argumentos del estimador de sklearn
    learning_rate: 0.1
    max_depth: 3
    n_estimators: 100

mlflow:
  tracking_uri: http://localhost:5000  # servidor de MLflow de services/. Sin servidor: sqlite:///mlflow.db. MLFLOW_TRACKING_URI, si existe, tiene prioridad
  experimento: churn-training-mlops    # nombre del experimento donde se agrupan los runs
  nombre_run: churn-training       # nombre de cada run dentro del experimento
  tag_fase: entrenamiento            # tag para identificar runs de entrenamiento

metricas:
  umbral: 0.5                         # probabilidad a partir de la cual se predice churn (Recommendation_Label = 1)

features:
  seleccion: "ALL"   # ALL | NUMERIC | CUSTOM (ver features.yaml)