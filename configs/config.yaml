# Configuración unificada del proyecto (Actividad 3).
# Todo lo que puede cambiar (datos, división, features, modelos candidatos, MLflow, registro,
# inferencia y monitoreo de drift) vive aquí, no en el código.
# Dataset: https://www.kaggle.com/datasets/colabsss/consumer-portrait-e-commerce-dataset

datos:
  ruta: data/Consumer_Portrait_ECommerce_Recommendation_Dataset.csv

division:
  test_size: 0.2
  random_state: 42          # también se registra como semilla en MLflow

# Conjuntos de features. Cada candidato se entrena con cada uno: un run por combinación.
# columnas: ALL para todas las variables, o una lista con los nombres exactos del CSV.
features:
  - nombre: all
    columnas: ALL
  - nombre: custom
    columnas:
      - Age
      - Gender
      - Region
      - Occupation
      - Income_Level
      - Membership_Level
      - Shopping_Device
      - Purchase_Count
      - Purchase_Value
      - Interaction_Score
      - Customer_Loyalty_Score
      - Product_Relevance_Score
      - Product_Category

# Modelos que el flow de entrenamiento compara. Cada uno se entrena con cada conjunto de `features`.
# Cada run se llama `<nombre_run>-<nombre de features>`. Solo el de mayor AUC se evalúa para champion.
candidatos:
  - nombre_run: ecommerce-logreg-c1
    tipo: logistic_regression
    parametros:
      C: 1.0
      max_iter: 1000
  - nombre_run: ecommerce-logreg-c01
    tipo: logistic_regression
    parametros:
      C: 0.1
      max_iter: 1000
  - nombre_run: ecommerce-gbt
    tipo: gradient_boosting
    parametros:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      random_state: 42
  - nombre_run: ecommerce-forest
    tipo: random_forest
    parametros:
      n_estimators: 200
      max_depth: 10
      min_samples_leaf: 5
      random_state: 42
      n_jobs: -1

mlflow:
  tracking_uri: http://localhost:5000  # servidor de MLflow de services/. MLFLOW_TRACKING_URI, si existe, tiene prioridad
  experimento: ecommerce-recommendation-mlops    # nombre del experimento donde se agrupan los runs
  nombre_run: ecommerce-training                 # prefijo de run

metricas:
  umbral: 0.5                          # probabilidad a partir de la cual se predice recomendación (Recommendation_Label = 1)

# Registro del modelo e inferencia.
registro:
  nombre_modelo: ecommerce-recommendation-modelo   # nombre en el Model Registry de MLflow
  umbral_auc: 0.90                                  # AUC mínimo para ser champion; además debe superar al champion actual

inferencia:
  tamano_lote: 500              # clientes que se puntúan en cada ejecución (lote de la parte de prueba)
  carpeta_salida: data          # carpeta donde se guardan las predicciones diarias
  nivel_drift: 0.6              # emulación de drift: 0.0 sin drift, 0.3 medio, 0.6 alto (ver domain/monitoreo.py)

# Detección de drift (Actividad 3).
monitoreo:
  lotes_dir: lotes                    # copias de los lotes puntuados (histórico + último por nivel)
  lote_actual: lotes/lote_actual.csv  # lote que puntúa la inferencia; lo leen los flows de drift
  umbral_drift: 0.3                   # fracción de variables con drift a partir de la cual se emite una alerta
  alfa_evento: 0.05                   # p-valor por debajo del cual el drift del target se considera drift
  carpeta_reportes: reports           # reportes HTML/JSON por lote (ignorada por git)
