# Selección de variables para el experimento MLflow (Actividad 2)
# Cada run registra el alias en el parámetro 'features' y el número de variables en 'n_features'
#
# Opciones disponibles en 'seleccion':
# - ALL     : todas las variables numéricas y categóricas
# - NUMERIC : solo variables numéricas
# - CUSTOM  : solo las variables definidas en la lista 'custom'

seleccion: "ALL"

# Lista utilizada únicamente cuando seleccion es "CUSTOM":
custom:
  - "Age"
  - "Gender"
  - "Region"
  - "Occupation"
  - "Income_Level"
  - "Membership_Level"
  - "Shopping_Device"
  - "Purchase_Count"
  - "Purchase_Value"
  - "Interaction_Score"
  - "Customer_Loyalty_Score"
  - "Product_Relevance_Score"
  - "Product_Category"
