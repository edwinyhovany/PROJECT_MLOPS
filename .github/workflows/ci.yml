name: CI MLOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache del entorno de Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias
        run: poetry install --no-interaction

      - name: Ejecutar suite de pruebas unitarias
        run: poetry run pytest -v

      - name: Generar evidencia de drift (niveles 0.0, 0.3, 0.6)
        run: poetry run python scripts/evidencia_drift.py

      - name: Subir artefactos y reportes de drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports-ecommerce
          path: |
            reports/
            lotes/
          if-no-files-found: ignore
